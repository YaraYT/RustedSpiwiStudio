name: Rusted -test build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: "-test / Build"
    if: contains(format(' {0} ', github.event.head_commit.message), ' -test ')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RustedShpizhionStudio.sln

      - name: Publish
        id: publish
        shell: pwsh
        run: |
          dotnet publish RustedShpizhionStudio.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -o publish `
            -bl:publish.binlog

      - name: Package successful test build
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\\*" -DestinationPath "RustedSpiwiStudio-0.1.1-test.zip" -Force

      - name: Upload successful test artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rusted-test-0.1.1
          path: RustedSpiwiStudio-0.1.1-test.zip
          if-no-files-found: error

      - name: Diagnostic result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.publish.outcome }}" -eq "success") {
            @"
          ## 🟢 ТЕСТОВАЯ СБОРКА УСПЕШНА

          `RustedShpizhionStudio` успешно собран.

          - Runtime: `win-x64`
          - Configuration: `Release`
          - Native AOT: `true`
          - Single File: `true`
          - Trimmed: `true`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          else {
            @"
          ## 🔴 ТЕСТОВАЯ СБОРКА НЕ СОБРАЛАСЬ

          `dotnet publish` завершился с ошибкой.

          Открой шаг **Publish** выше для просмотра точной ошибки.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rusted-test-diagnostics
          path: publish.binlog
          if-no-files-found: ignore
